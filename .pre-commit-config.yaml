repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.3.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-json

- repo: local  # uses the ruff pinned in pyproject.toml
  hooks:
    - id: ruff
      name: ruff
      entry: uv run ruff check --fix
      language: system
      types_or: [python, jupyter]
    - id: ruff-format
      name: ruff format
      entry: uv run ruff format
      language: system
      types_or: [python, jupyter]
